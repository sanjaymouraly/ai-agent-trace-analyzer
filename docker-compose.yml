services:
  tracelens:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-execution-debugger:local
    ports:
      - "${TRACELENS_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-TraceLens}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/tracelens.db}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEFAULT_REDACTION: ${DEFAULT_REDACTION:-true}
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_SPANS_PER_RUN: ${MAX_SPANS_PER_RUN:-20000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-0}
      REDIS_URL: ${REDIS_URL:-}
      # Optional AI assistance. Disabled by default; offline analysis always works.
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-disabled}
      APP_LLM_MAX_DAILY_REQUESTS: ${APP_LLM_MAX_DAILY_REQUESTS:-20}
      APP_LLM_MAX_REQUESTS_PER_MINUTE: ${APP_LLM_MAX_REQUESTS_PER_MINUTE:-5}
      APP_LLM_TIMEOUT_SECONDS: ${APP_LLM_TIMEOUT_SECONDS:-20}
      APP_LLM_MAX_COMPLETION_TOKENS: ${APP_LLM_MAX_COMPLETION_TOKENS:-800}
      APP_LLM_DAILY_BUDGET_USD: ${APP_LLM_DAILY_BUDGET_USD:-1.0}
      APP_LLM_MONTHLY_BUDGET_USD: ${APP_LLM_MONTHLY_BUDGET_USD:-10.0}
      APP_LLM_ALLOW_PRIVATE_BASE_URL: ${APP_LLM_ALLOW_PRIVATE_BASE_URL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - tracelens-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional PostgreSQL for multi-user deployments.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelens}
      POSTGRES_DB: ${POSTGRES_DB:-tracelens}
    volumes:
      - tracelens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracelens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional Redis queue for background processing.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - tracelens-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tracelens-data:
    name: tracelens-data
  tracelens-postgres:
    name: tracelens-postgres
  tracelens-redis:
    name: tracelens-redis
